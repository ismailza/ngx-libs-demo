server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API is served from the same origin as the app, so the SameSite=Strict
  # refresh cookie is sent and no CORS configuration is needed. `^~` stops the
  # static-asset regex below from catching API paths that end in .js, .png, etc.
  location ^~ /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles can be cached forever; index.html must not be. favicon.ico is
  # not hashed, so it keeps the default caching.
  location ~* \.(?:js|css|woff2?|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

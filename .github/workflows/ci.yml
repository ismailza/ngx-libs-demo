name: CI

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - feature/**
      - 'releases/**'

permissions:
  contents: read

jobs:
  server:
    name: Server (build + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - run: dotnet build NgxLibsDemo.slnx -c Release
      # Testcontainers starts Postgres 18 on the runner's Docker.
      - run: dotnet test NgxLibsDemo.slnx -c Release --no-build

  client:
    name: Client (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SIGNING_KEY: ci-only-signing-key-0123456789abcdefghij
